services:
  - type: web
    name: polymarket-orderflow-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w api
    startCommand: npm start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: POLYMARKET_PRIVATE_KEY
        sync: false
      - key: POLYMARKET_FUNDER
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_API_SECRET
        sync: false
      - key: POLYMARKET_API_PASSPHRASE
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: polymarket-orderflow-web
    runtime: static
    buildCommand: npm ci && npm run build -w web
    staticPublishPath: web/dist
    envVars:
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
